name: Record hackathon demo
on:
  push:
    branches: ['feat/**']
    paths: ['tools/demo/**', '.github/workflows/demo-video.yml']
  workflow_dispatch:
    inputs:
      narration:
        description: 'Use ElevenLabs (requires configured secrets and available credits)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install recorder and browser
        run: |
          npm ci
          # Ubuntu runners already include Chrome runtime dependencies.
          npx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then
            timeout 180 sudo apt-get update -qq
            timeout 180 sudo apt-get install -y ffmpeg
          fi
      - name: Record prototype with Stagehand
        env:
          ELEVENLABS_API_KEY: ${{ inputs.narration && secrets.ELEVENLABS_API_KEY || '' }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          REQUIRE_NARRATION: ${{ inputs.narration }}
        run: npm run record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhishNet-hackathon-demo
          path: |
            tools/demo/output/PhishNet-*.mp4
            tools/demo/output/narration.srt
            tools/demo/output/PhishNet-hackathon-demo.srt
            tools/demo/output/video-validation.json
            tools/demo/output/narration.txt
            tools/demo/output/evidence.json
            tools/demo/output/*.png
          if-no-files-found: error
