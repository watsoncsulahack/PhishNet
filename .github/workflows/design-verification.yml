name: Verify design and API smoke tests
on:
  push:
    paths:
      - 'docs/design-reset/**'
      - 'scripts/verify-design-docs.mjs'
      - 'scripts/smoke-api.mjs'
      - '.github/workflows/design-verification.yml'
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.js'
  pull_request:
    paths:
      - 'docs/design-reset/**'
      - 'scripts/verify-design-docs.mjs'
      - 'scripts/smoke-api.mjs'
      - '.github/workflows/design-verification.yml'
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.js'
jobs:
  docs-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentation structure
        run: node scripts/verify-design-docs.mjs
      - name: Smoke test the actual Node API
        run: node scripts/smoke-api.mjs
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:chain
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
